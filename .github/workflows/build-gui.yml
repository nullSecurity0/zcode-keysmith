name: Build Windows GUI

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 5. 安装依赖
        working-directory: gui
        run: |
          python -m pip install -r requirements-build.txt
          npm ci

      - name: 6. 打包 Tauri 桌面端（自动编译 sidecar 并生成安装包）
        working-directory: gui
        run: npm run bundle

      - name: 7. 上传生成的 exe 安装包
        uses: actions/upload-artifact@v4
        with:
          name: zcode-keysmith-setup-exe
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
