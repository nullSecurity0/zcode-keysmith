name: Build Windows GUI

on:
  workflow_dispatch: # 允许你在 GitHub 网页上手动点击按钮触发

jobs:
  build-windows:
    runs-on: windows-latest # 使用 GitHub 官方提供的 Windows 虚拟机（自带 VS2022/C++）

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 5. 安装依赖并编译 Sidecar
        working-directory: gui
        run: |
          npm ci
          python -m venv src-tauri/target/sidecar-venv
          ./src-tauri/target/sidecar-venv/Scripts/python.exe -m pip install -r requirements-build.txt
          $env:PYTHON = "$((Get-Location).Path)/src-tauri/target/sidecar-venv/Scripts/python.exe"
          npm run build:sidecar

      - name: 6. 打包 Tauri 桌面端
        working-directory: gui
        run: |
          npm run bundle

      - name: 7. 上传生成的 exe 安装包
        uses: actions/upload-artifact@v4
        with:
          name: zcode-keysmith-setup-exe
          path: gui/src-tauri/target/release/bundle/nsis/*.exe
